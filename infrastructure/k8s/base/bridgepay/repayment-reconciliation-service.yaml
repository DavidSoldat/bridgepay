apiVersion: apps/v1
kind: Deployment
metadata:
  name: repayment-reconciliation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: repayment-reconciliation-service
  template:
    metadata:
      labels:
        app: repayment-reconciliation-service
    spec:
      enableServiceLinks: false
      containers:
        - name: repayment-reconciliation-service
          image: ghcr.io/davidsoldat/bridgepay-repayment-reconciliation-service:latest
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef: { name: bridgepay-env }
            - secretRef: { name: bridgepay-credentials }
            - secretRef: { name: paddle-credentials }
          env:
            - { name: APPLICANT_SERVICE_URL, value: "http://applicant-service:8080" }
            - { name: PADDLE_BASE_URL, value: "https://sandbox-api.paddle.com" }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8084 }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8084 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8084 }
            periodSeconds: 5
          # Above spec section 13's 256Mi/384Mi: measured ~360Mi at idle on k3d, and the
          # Dockerfile's MaxRAMPercentage=75 leaves too little non-heap room at 384Mi.
          resources:
            requests: { memory: 384Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: repayment-reconciliation-service
spec:
  selector:
    app: repayment-reconciliation-service
  ports:
    - port: 8084
