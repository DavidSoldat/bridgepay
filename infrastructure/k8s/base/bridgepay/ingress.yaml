# /api reaches the gateway through each frontend's own nginx proxy, so there's
# no gateway rule here. /webhooks/paddle goes straight to repayment-reconciliation.
# Keycloak's Ingress lives in the platform namespace.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontends
spec:
  ingressClassName: traefik
  rules:
    - host: app.localhost
      http:
        paths:
          # Paddle webhooks: public by necessity; the HMAC Paddle-Signature check is the control.
          - path: /webhooks/paddle
            pathType: Exact
            backend:
              service:
                name: repayment-reconciliation-service
                port:
                  number: 8084
          - path: /
            pathType: Prefix
            backend:
              service:
                name: main-app
                port:
                  number: 80
    - host: shop.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storefront
                port:
                  number: 80
    - host: localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: landing
                port:
                  number: 80
