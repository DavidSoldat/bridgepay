# /api reaches the gateway through each frontend's own nginx proxy, so there's
# no gateway rule here. Keycloak's Ingress lives in the platform namespace.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontends
spec:
  ingressClassName: traefik
  rules:
    - host: app.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: main-app
                port:
                  number: 80
    - host: shop.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storefront
                port:
                  number: 80
