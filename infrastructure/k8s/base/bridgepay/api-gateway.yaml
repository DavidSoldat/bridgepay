apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      enableServiceLinks: false
      containers:
        - name: api-gateway
          image: ghcr.io/davidsoldat/bridgepay-api-gateway:latest
          ports:
            - containerPort: 8086
          envFrom:
            - configMapRef: { name: bridgepay-env }
          env:
            - { name: APPLICANT_SERVICE_URL, value: "http://applicant-service:8080" }
            - { name: APPLICATION_SERVICE_URL, value: "http://application-service:8081" }
            - { name: REPAYMENT_RECONCILIATION_SERVICE_URL, value: "http://repayment-reconciliation-service:8084" }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8086 }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8086 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8086 }
            periodSeconds: 5
          resources:
            requests: { memory: 256Mi }
            limits: { memory: 384Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8086
