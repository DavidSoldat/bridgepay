apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications-service
  template:
    metadata:
      labels:
        app: notifications-service
    spec:
      enableServiceLinks: false
      containers:
        - name: notifications-service
          image: ghcr.io/davidsoldat/bridgepay-notifications-service:latest
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef: { name: bridgepay-env }
            - secretRef: { name: bridgepay-credentials }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8085 }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8085 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8085 }
            periodSeconds: 5
          # Above spec section 13's 256Mi/384Mi: measured ~360Mi at idle on k3d, and the
          # Dockerfile's MaxRAMPercentage=75 leaves too little non-heap room at 384Mi.
          resources:
            requests: { memory: 384Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: notifications-service
spec:
  selector:
    app: notifications-service
  ports:
    - port: 8085
