# platform: only BridgePay pods and platform itself. Postgres/Redis/Kafka are never reachable from kube-system.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-trusted-namespaces
  namespace: platform
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: bridgepay } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: platform } }
---
# Traefik (kube-system) reaches Keycloak only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-keycloak
  namespace: platform
spec:
  podSelector: { matchLabels: { app: keycloak } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
---
# cert-manager's HTTP-01 solver pods (one per pending certificate, in the Ingress's namespace) must be reachable by Traefik.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-acme-solver
  namespace: platform
spec:
  podSelector: { matchLabels: { acme.cert-manager.io/http01-solver: "true" } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
---
# bridgepay: only itself and Traefik. /internal/** stays cluster-internal by construction.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-trusted-namespaces
  namespace: bridgepay
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: bridgepay } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
