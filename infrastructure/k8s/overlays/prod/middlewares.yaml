# Traefik v3 middlewares. Cross-namespace references are off by default, so the
# HTTPS redirect exists in both namespaces that own an Ingress.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: bridgepay
spec:
  redirectScheme: { scheme: https, permanent: true }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: platform
spec:
  redirectScheme: { scheme: https, permanent: true }
---
# Frontend hosts only. Not on auth.: keycloak-js check-sso frames Keycloak pages.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: bridgepay
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    contentTypeNosniff: true
    referrerPolicy: strict-origin-when-cross-origin
    frameDeny: true
