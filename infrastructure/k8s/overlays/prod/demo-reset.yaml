apiVersion: v1
kind: ServiceAccount
metadata: { name: demo-reset, namespace: bridgepay }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: demo-reset, namespace: bridgepay }
rules:
  - apiGroups: [apps]
    resources: [deployments, deployments/scale]
    verbs: [get, list, patch, update]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: demo-reset, namespace: bridgepay }
subjects: [{ kind: ServiceAccount, name: demo-reset, namespace: bridgepay }]
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: demo-reset }
---
# Public demo: erase everything visitors typed, nightly. The superuser re-creates each schema empty and owned
# by its service's login (which can't create schemas itself); Flyway re-creates the tables and seeds on start.
# keycloak schema untouched (fixed demo users). Kafka untouched (offsets committed; consumers skip unknown ids).
# ponytail: if a step fails after scale-down, the 5 services stay at 0 until a retry succeeds
# (backoffLimit 2); a job that gives up leaves the demo down until the next night or a manual
# `kubectl -n bridgepay scale deploy ... --replicas=1`. Alert on failed Jobs if that ever matters.
apiVersion: batch/v1
kind: CronJob
metadata: { name: demo-reset, namespace: bridgepay }
spec:
  schedule: "0 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: demo-reset
          restartPolicy: OnFailure
          # registry.k8s.io/kubectl is distroless (no shell): each kubectl step is its own container.
          initContainers:
            - name: scale-down
              image: registry.k8s.io/kubectl:v1.36.5
              args: [scale, deploy, applicant-service, application-service, repayment-reconciliation-service,
                     notifications-service, api-gateway, --replicas=0]
            - name: wait-for-pods-gone
              image: registry.k8s.io/kubectl:v1.36.5
              args: [wait, --for=delete, pod, --timeout=180s,
                     -l, "app in (applicant-service,application-service,repayment-reconciliation-service,notifications-service,api-gateway)"]
            - name: drop-schemas
              image: postgres:16-alpine
              envFrom: [{ secretRef: { name: bridgepay-credentials } }]
              command: [sh, -c]
              args:
                - >-
                  PGPASSWORD="$DB_PASSWORD" psql -v ON_ERROR_STOP=1 -h postgres.platform -U "$DB_USERNAME" -d bridgepay
                  -c 'DROP SCHEMA IF EXISTS applicant, application, repayment, notifications, audit CASCADE'
                  -c 'CREATE SCHEMA applicant AUTHORIZATION applicant_service'
                  -c 'CREATE SCHEMA application AUTHORIZATION application_service'
                  -c 'CREATE SCHEMA repayment AUTHORIZATION repayment_reconciliation_service'
                  -c 'CREATE SCHEMA notifications AUTHORIZATION notifications_service'
                  -c 'CREATE SCHEMA audit AUTHORIZATION api_gateway'
            - name: flush-redis
              image: redis:7-alpine
              command: [redis-cli, -h, redis.platform, FLUSHALL]
            # A deploy during the reset re-applies replicas: 1, so a pod can start (and run Flyway)
            # before the drop and keep running on dropped tables. Restarting after the drop replaces it;
            # every pod from here on starts on empty schemas.
            - name: restart
              image: registry.k8s.io/kubectl:v1.36.5
              args: [rollout, restart, deploy, applicant-service, application-service, repayment-reconciliation-service,
                     notifications-service, api-gateway]
          containers:
            - name: scale-up
              image: registry.k8s.io/kubectl:v1.36.5
              args: [scale, deploy, applicant-service, application-service, repayment-reconciliation-service,
                     notifications-service, api-gateway, --replicas=1]
