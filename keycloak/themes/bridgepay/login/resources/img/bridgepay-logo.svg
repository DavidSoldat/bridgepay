<!-- Used as a CSS background-image (Keycloak login logo), which browsers render
     in an isolated "image context" that cannot fetch external fonts - so this
     falls back to the system sans-serif stack rather than IBM Plex Sans.
     ponytail: font fallback only, swap for outlined IBM Plex Sans paths if
     pixel-perfect brand fidelity in this exact spot ever matters. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" fill="none">
  <style>
    .wordmark {
      font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 600;
      font-size: 34px;
      letter-spacing: -0.01em;
      fill: #2F5D50;
    }
  </style>
  <path d="M8 22 L56 22" stroke="#2F5D50" stroke-width="5" stroke-linecap="round"/>
  <path d="M8 22 Q32 54 56 22" stroke="#2F5D50" stroke-width="5" stroke-linecap="round"/>
  <text x="78" y="44" class="wordmark">BridgePay</text>
</svg>
