name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main run: it may be mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-java:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - applicant-service
          - application-service
          - credit-risk-engine
          - mock-credit-bureau
          - notifications-service
          - repayment-reconciliation-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: mvn clean verify
        run: mvn -f services/${{ matrix.service }} clean verify

  test-angular:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - main-app
          - storefront
          - landing
    steps:
      - uses: actions/checkout@v4
      - name: Brand tokens identical in all apps
        run: |
          cmp frontend/main-app/src/brand.css frontend/storefront/src/brand.css
          cmp frontend/main-app/src/brand.css frontend/landing/src/brand.css
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned npm and dependencies
        working-directory: frontend/${{ matrix.app }}
        run: |
          npm install -g npm@11.6.1
          npm ci
      - name: ng test
        working-directory: frontend/${{ matrix.app }}
        run: npx ng test --watch=false

  render-k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The repo is public: a committed realm key would let anyone sign tokens Keycloak accepts.
      - name: No Keycloak signing keys in the realm export
        run: |
          ! grep -nE '"(privateKey|secret)" :' infrastructure/keycloak/bridgepay-realm.json
      - name: Render both overlays
        run: |
          # overlays/local reads the gitignored .env; the runner gets the placeholder template.
          cp .env.example .env
          kubectl kustomize --load-restrictor LoadRestrictionsNone infrastructure/k8s/overlays/local > /dev/null
          kubectl kustomize --load-restrictor LoadRestrictionsNone infrastructure/k8s/overlays/prod > /dev/null

  build-and-push:
    needs: [test-java, test-angular]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: services/applicant-service
            image: bridgepay-applicant-service
          - directory: services/application-service
            image: bridgepay-application-service
          - directory: services/credit-risk-engine
            image: bridgepay-credit-risk-engine
          - directory: services/mock-credit-bureau
            image: bridgepay-mock-credit-bureau
          - directory: services/notifications-service
            image: bridgepay-notifications-service
          - directory: services/repayment-reconciliation-service
            image: bridgepay-repayment-reconciliation-service
          - directory: services/api-gateway
            image: bridgepay-api-gateway
          - directory: frontend/main-app
            image: bridgepay-main-app
          - directory: frontend/storefront
            image: bridgepay-storefront
          - directory: frontend/landing
            image: bridgepay-landing
    steps:
      - uses: actions/checkout@v4
      # No QEMU: the Dockerfiles' build stages run on the runner's own amd64
      # ($BUILDPLATFORM) and the arm64 run stages only COPY, so nothing executes under emulation.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.directory }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/davidsoldat/${{ matrix.image }}:latest
            ghcr.io/davidsoldat/${{ matrix.image }}:${{ github.sha }}

  # Production: the OCI VM. The deploy key can only run /usr/local/bin/bridgepay-deploy
  # (infrastructure/k8s/prod-host/), which applies stdin and waits for every rollout.
  deploy:
    needs: [build-and-push, render-k8s]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Render production manifests pinned to this commit
        run: |
          sed -i "s/newTag: latest/newTag: ${GITHUB_SHA}/" infrastructure/k8s/overlays/prod/kustomization.yaml
          kubectl kustomize --load-restrictor LoadRestrictionsNone infrastructure/k8s/overlays/prod > rendered.yaml
          ! grep -n ':latest' rendered.yaml
      - name: Apply on the VM
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -p 2222 -i ~/.ssh/deploy -o StrictHostKeyChecking=yes "deploy@${DEPLOY_HOST}" < rendered.yaml
