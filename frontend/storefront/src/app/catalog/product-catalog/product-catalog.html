<div class="mx-auto max-w-5xl px-4 py-8 sm:px-8">
  <header class="mb-8">
    <h1 class="font-display text-3xl font-bold tracking-tight sm:text-4xl">Considered gear for slow trips outside.</h1>
    <p class="mt-2 flex flex-wrap items-center gap-1.5 text-ink-muted">
      Pay in 4 interest-free payments with <app-bridgepay-mark size="sm" />
    </p>
  </header>
  <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
    @for (product of products; track product.id) {
      <article class="overflow-hidden rounded-lg bg-surface shadow-raised transition-shadow focus-within:outline-2 focus-within:outline-coral hover:shadow-lg">
        <a [routerLink]="['/products', product.id]" class="flex h-full flex-col">
          <img
            [src]="product.image"
            [alt]="product.imageAlt"
            loading="lazy"
            width="1200"
            height="900"
            class="aspect-[4/3] w-full object-cover"
            [style.background-color]="product.swatchColor"
          />
          <div class="flex flex-1 flex-col gap-1 p-5">
            <h2 class="font-medium">{{ product.name }}</h2>
            <p class="font-display text-2xl font-bold">${{ product.price | number: '1.2-2' }}</p>
            <p class="flex flex-wrap items-center gap-1 text-sm text-ink-muted">
              or 4 × <strong class="text-coral">${{ installment(product) | number: '1.2-2' }}</strong> with
              <app-bridgepay-mark size="sm" />
            </p>
          </div>
        </a>
      </article>
    }
  </div>
</div>
