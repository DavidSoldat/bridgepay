<div class="max-w-md">
  <h1 class="font-serif text-2xl mb-1">Where should we send it?</h1>
  <p class="text-ink-muted mb-6">Free shipping on orders over $100.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
    <label class="flex flex-col gap-1">
      <span class="text-sm text-ink-muted">Full name</span>
      <input formControlName="fullName" autocomplete="name" class="border border-hairline px-3 py-2 rounded-lg" />
    </label>
    <label class="flex flex-col gap-1">
      <span class="text-sm text-ink-muted">Street address</span>
      <input formControlName="street" autocomplete="street-address" class="border border-hairline px-3 py-2 rounded-lg" />
    </label>
    <div class="flex gap-4">
      <label class="flex flex-col gap-1 flex-1">
        <span class="text-sm text-ink-muted">City</span>
        <input formControlName="city" autocomplete="address-level2" class="border border-hairline px-3 py-2 rounded-lg" />
      </label>
      <label class="flex flex-col gap-1 w-32">
        <span class="text-sm text-ink-muted">Postal code</span>
        <input formControlName="postalCode" autocomplete="postal-code" class="border border-hairline px-3 py-2 rounded-lg" />
      </label>
    </div>

    @if (form.touched && form.invalid) {
      <p class="text-sm text-red-700">Please fill in every field.</p>
    }

    <button
      type="submit"
      class="mt-2 px-4 py-2 rounded-lg bg-widget-accent text-white font-widget font-medium"
    >Continue to review</button>
  </form>
</div>
