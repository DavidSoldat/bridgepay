<header class="border-b border-hairline bg-surface">
  <div class="mx-auto flex max-w-5xl flex-wrap items-center gap-x-6 gap-y-2 px-4 py-3 sm:px-8">
    <span class="mr-auto font-display text-xl font-bold">Ridgeline Supply Co.</span>
    <nav class="flex items-center gap-5 text-sm font-medium" aria-label="Store">
      <a routerLink="/" class="text-ink hover:text-coral">Shop</a>
      @if (auth.authenticated()) {
        <a routerLink="/account" class="text-ink hover:text-coral">My Account</a>
        <button type="button" (click)="auth.logout()" class="btn-secondary">Sign out</button>
      } @else {
        <button type="button" (click)="signIn()" class="btn-secondary">Sign in</button>
      }
    </nav>
  </div>
</header>
<router-outlet />
