<div class="card max-w-lg p-6 sm:p-8">
  <h1 class="mb-1 font-display text-2xl font-bold">Tell us who you are</h1>
  <p class="mb-6 text-ink-muted">Just once — we'll remember you next time.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="flex flex-col gap-4">
    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium">First name</span>
      <input formControlName="firstName" autocomplete="given-name" class="input" />
      @if (showError('firstName')) {
        <span class="text-sm text-declined">Enter your first name</span>
      }
    </label>
    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium">Last name</span>
      <input formControlName="lastName" autocomplete="family-name" class="input" />
      @if (showError('lastName')) {
        <span class="text-sm text-declined">Enter your last name</span>
      }
    </label>
    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium">Date of birth</span>
      <input formControlName="dateOfBirth" type="date" [max]="latestBirthDate" autocomplete="bday" class="input" />
      @if (showError('dateOfBirth')) {
        <span class="text-sm text-declined">
          {{ form.controls.dateOfBirth.hasError('tooYoung') ? 'You must be at least 18 to use Pay in 4' : 'Enter your date of birth' }}
        </span>
      }
    </label>
    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium">Email</span>
      <input formControlName="email" type="email" autocomplete="email" class="input" />
      @if (showError('email')) {
        <span class="text-sm text-declined">Enter an email like name&#64;example.com</span>
      }
    </label>
    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium">Phone</span>
      <input formControlName="phone" type="tel" autocomplete="tel" class="input" />
      @if (showError('phone')) {
        <span class="text-sm text-declined">Enter a phone number with 7–15 digits</span>
      }
    </label>

    @if (error(); as message) {
      <p role="alert" class="text-sm text-declined">{{ message }}</p>
    }

    <button type="submit" [disabled]="submitting()" class="btn-primary mt-2 self-start">Continue</button>
  </form>
</div>
