<figure class="m-0">
  <figcaption [id]="titleId" class="sr-only">{{ title() }}</figcaption>
  <ul class="mb-3 flex flex-wrap gap-x-4 gap-y-1 text-xs text-ink-muted" aria-hidden="true">
    <li class="flex items-center gap-1.5"><span class="size-2.5 rounded-sm bg-coral"></span>raises risk</li>
    <li class="flex items-center gap-1.5"><span class="size-2.5 rounded-sm bg-chart-cool"></span>lowers risk</li>
    <li class="flex items-center gap-1.5"><span class="h-2.5 w-4 rounded-sm bg-blush"></span>normal range (±{{ band() }})</li>
  </ul>
  <div class="space-y-2" aria-hidden="true">
    @for (r of bars(); track r.feature) {
      <!-- Phones: label on its own line, so the track gets the row's width -->
      <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-sm sm:flex-nowrap" [attr.data-shifted]="r.shifted">
        <div class="basis-full truncate sm:basis-auto sm:w-44 sm:shrink-0" [title]="r.label">{{ r.label }}</div>
        <div class="relative h-4 min-w-0 flex-1 rounded-full bg-cream">
          <div data-testid="drift-band" class="absolute inset-y-0 bg-blush"
               [style.left.%]="50 - bandWidthPct() / 2" [style.width.%]="bandWidthPct()"></div>
          <div class="absolute inset-y-0 left-1/2 w-px bg-ink-muted"></div>
          @if (r.mean >= 0) {
            <div data-testid="drift-bar" class="absolute inset-y-0.5 rounded-r-full bg-coral" style="left: 50%" [style.width.%]="r.width"></div>
          } @else {
            <div data-testid="drift-bar" class="absolute inset-y-0.5 rounded-l-full bg-chart-cool" style="right: 50%" [style.width.%]="r.width"></div>
          }
        </div>
        <div data-testid="drift-value" class="flex shrink-0 items-center gap-2">
          <span class="w-12 text-right font-mono">{{ r.text }}</span>
          @if (r.shifted) { <app-status-badge status="SHIFTED" /> }
        </div>
      </div>
    }
  </div>

  <!-- sr-only on a div, not the table: a table ignores width: 1px and would widen the page on phones -->
  <div class="sr-only">
    <table [attr.aria-labelledby]="titleId">
      <thead><tr><th scope="col">Feature</th><th scope="col">Mean contribution</th><th scope="col">Status</th></tr></thead>
      <tbody>
        @for (r of bars(); track r.feature) {
          <tr><th scope="row">{{ r.label }}</th><td>{{ r.text }}</td><td>{{ r.shifted ? 'Shifted' : 'Within range' }}</td></tr>
        }
      </tbody>
    </table>
  </div>
</figure>
