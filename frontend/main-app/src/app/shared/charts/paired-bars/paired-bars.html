<figure class="m-0">
  <figcaption [id]="titleId" class="sr-only">{{ title() }}</figcaption>
  <ul data-legend class="mb-2 flex flex-wrap gap-x-4 gap-y-1 text-xs text-ink-muted">
    <li class="flex items-center gap-1.5"><span class="size-2.5 rounded-sm bg-chart-cool"></span>Training</li>
    <li class="flex items-center gap-1.5"><span class="size-2.5 rounded-sm bg-coral"></span>This period</li>
  </ul>
  <svg
    [attr.viewBox]="'0 0 ' + width() + ' ' + C.height"
    class="block h-auto w-full overflow-visible rounded-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-coral"
    tabindex="0"
    role="group"
    [attr.aria-label]="title() + ' chart. Use the left and right arrow keys to read each band.'"
    (keydown)="onKey($event)"
    (pointerleave)="activeIndex.set(null)"
    (blur)="activeIndex.set(null)"
  >
    @for (t of ticks(); track t) {
      <line [attr.x1]="C.padLeft" [attr.x2]="width() - C.padRight" [attr.y1]="y()(t)" [attr.y2]="y()(t)" class="stroke-hairline" stroke-width="1" />
      <text [attr.x]="C.padLeft - 6" [attr.y]="y()(t)" text-anchor="end" dominant-baseline="middle" class="fill-ink-muted text-[11px]">{{ pct(t) }}</text>
    }

    @for (b of bars(); track $index) {
      <path data-testid="bar-training" [attr.d]="b.training" class="fill-chart-cool"
            [attr.opacity]="activeIndex() === null || activeIndex() === $index ? 1 : 0.45" />
      <path data-testid="bar-current" [attr.d]="b.current" class="fill-coral"
            [attr.opacity]="activeIndex() === null || activeIndex() === $index ? 1 : 0.45" />
    }

    @for (m of markerXs(); track m.at) {
      <line data-testid="marker" [attr.x1]="m.x" [attr.x2]="m.x" [attr.y1]="C.padTop" [attr.y2]="baseline"
            class="stroke-ink-muted" stroke-width="1" stroke-dasharray="3 3" />
      <text [attr.x]="m.x + 4" [attr.y]="C.padTop + 10" class="fill-ink-muted text-[11px]">{{ m.label }}</text>
    }

    @for (r of rows(); track $index) {
      @if ($index % labelEvery() === 0) {
        <text [attr.x]="xs()[$index]" [attr.y]="C.height - 4" text-anchor="middle" class="fill-ink-muted text-[11px]">{{ r.label }}</text>
      }
      <rect data-hit [attr.x]="xs()[$index] - band() / 2" [attr.y]="C.padTop" [attr.width]="band()"
            [attr.height]="baseline - C.padTop" fill="transparent" (pointerenter)="activeIndex.set($index)" />
    }
  </svg>

  @if (tooltip(); as t) {
    <div
      data-testid="chart-tooltip"
      role="status"
      class="pointer-events-none absolute top-8 z-10 -translate-x-1/2 whitespace-nowrap rounded-sm bg-ink px-3 py-2 text-xs text-white shadow-raised"
      [style.left.%]="t.left"
    >
      <p class="font-semibold">Score {{ t.row.label }}</p>
      <p>Training {{ pct(t.row.training) }}</p>
      <p>This period {{ pct(t.row.current) }}</p>
    </div>
  }

  <!-- sr-only on a div, not the table: a table ignores width: 1px and would widen the page on phones -->
  <div class="sr-only">
    <table [attr.aria-labelledby]="titleId">
      <thead>
        <tr><th scope="col">Score</th><th scope="col">Training</th><th scope="col">This period</th></tr>
      </thead>
      <tbody>
        @for (r of rows(); track $index) {
          <tr><th scope="row">{{ r.label }}</th><td>{{ pct(r.training) }}</td><td>{{ pct(r.current) }}</td></tr>
        }
      </tbody>
    </table>
  </div>
</figure>
