<figure class="m-0">
  <figcaption [id]="titleId" class="mb-1 text-sm font-medium text-ink-muted">{{ title() }}</figcaption>
  <svg
    [attr.viewBox]="'0 0 ' + width() + ' ' + C.height"
    class="block h-auto w-full overflow-visible rounded-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-coral"
    tabindex="0"
    role="group"
    [attr.aria-label]="title() + ' chart. Use the left and right arrow keys to read each period.'"
    (keydown)="onKey($event)"
    (pointerleave)="activeIndex.set(null)"
    (blur)="activeIndex.set(null)"
  >
    @for (t of ticks(); track t) {
      <line [attr.x1]="C.padLeft" [attr.x2]="width() - C.padRight" [attr.y1]="y()(t)" [attr.y2]="y()(t)" class="stroke-hairline" stroke-width="1" />
      <text data-tick [attr.x]="C.padLeft - 6" [attr.y]="y()(t)" text-anchor="end" dominant-baseline="middle" class="fill-ink-muted text-[11px]">{{ fmt(t) }}</text>
    }

    @if (kind() === 'area') {
      <path data-mark="area" [attr.d]="area()" class="fill-coral/15" />
      <path data-mark="line" [attr.d]="line()" class="fill-none stroke-coral" stroke-width="2" stroke-linejoin="round" />
    } @else {
      @for (bar of bars(); track bar.i) {
        <path data-mark="bar" [attr.d]="bar.d" [class]="bar.i === activeIndex() ? 'fill-ink' : 'fill-ink-muted/60'" />
      }
    }

    @for (m of markers(); track m.at) {
      <line
        data-marker
        [attr.x1]="markerX(m.at)" [attr.x2]="markerX(m.at)"
        [attr.y1]="C.padTop" [attr.y2]="baseline"
        class="stroke-ink-muted" stroke-width="1" stroke-dasharray="4 3"
      />
      <text [attr.x]="markerX(m.at) + 4" [attr.y]="C.padTop + 10" class="fill-ink-muted text-[11px]">{{ m.label }}</text>
    }

    @if (activeIndex() !== null) {
      <line
        data-testid="crosshair"
        [attr.x1]="xs()[activeIndex()!]" [attr.x2]="xs()[activeIndex()!]"
        [attr.y1]="C.padTop" [attr.y2]="baseline"
        class="stroke-ink-muted" stroke-width="1" stroke-dasharray="3 3"
      />
      @if (kind() === 'area') {
        <circle [attr.cx]="xs()[activeIndex()!]" [attr.cy]="y()(points()[activeIndex()!].value)" r="4" class="fill-coral stroke-surface" stroke-width="2" />
      }
    }

    @for (p of points(); track $index) {
      @if ($index % labelEvery() === 0) {
        <text [attr.x]="xs()[$index]" [attr.y]="C.height - 4" text-anchor="middle" class="fill-ink-muted text-[11px]">{{ p.label }}</text>
      }
      <rect
        data-hit
        [attr.x]="xs()[$index] - band() / 2" [attr.y]="C.padTop"
        [attr.width]="band()" [attr.height]="baseline - C.padTop"
        fill="transparent"
        (pointerenter)="activeIndex.set($index)"
      />
    }
  </svg>
  <!-- sr-only on a div, not the table: a table ignores width: 1px and would widen the page on phones -->
  <div class="sr-only">
    <table [attr.aria-labelledby]="titleId">
      <thead><tr><th scope="col">{{ categoryLabel() }}</th><th scope="col">{{ title() }}</th></tr></thead>
      <tbody>
        @for (p of points(); track $index) {
          <tr><th scope="row">{{ p.label }}</th><td>{{ fmt(p.value, true) }}</td></tr>
        }
      </tbody>
    </table>
  </div>
</figure>
