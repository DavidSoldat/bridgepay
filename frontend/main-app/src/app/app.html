<div class="min-h-screen md:flex">
  <div class="flex items-center justify-between border-b border-hairline bg-surface px-4 py-2 md:hidden">
    <app-bridgepay-mark />
    <button
      type="button"
      (click)="menuOpen.set(!menuOpen())"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="main-nav"
      aria-label="Menu"
      class="flex size-11 items-center justify-center rounded-sm text-xl text-ink hover:bg-blush"
    >
      <app-icon name="menu" />
    </button>
  </div>

  <aside
    id="main-nav"
    class="flex-col gap-1 border-b border-hairline bg-surface p-4 md:sticky md:top-0 md:flex md:h-screen md:w-60 md:shrink-0 md:overflow-y-auto md:border-r md:border-b-0"
    [class.hidden]="!menuOpen()"
    [class.flex]="menuOpen()"
  >
    <div class="mb-6 hidden px-3 pt-2 md:block">
      <app-bridgepay-mark />
    </div>
    @if (auth.hasRole('ops')) {
      <a
        routerLink="/ops/dashboard"
        routerLinkActive="bg-blush text-coral-hover font-semibold"
        #rla0="routerLinkActive"
        [class.text-ink]="!rla0.isActive"
        (click)="menuOpen.set(false)"
        class="flex min-h-11 items-center gap-3 rounded-sm px-3 hover:bg-blush"
      ><app-icon name="chart-column" />Dashboard</a>
      <a
        routerLink="/ops/model"
        routerLinkActive="bg-blush text-coral-hover font-semibold"
        #rla7="routerLinkActive"
        [class.text-ink]="!rla7.isActive"
        (click)="menuOpen.set(false)"
        class="flex min-h-11 items-center gap-3 rounded-sm px-3 hover:bg-blush"
      ><app-icon name="activity" />Model</a>
      <a
        routerLink="/ops"
        routerLinkActive="bg-blush text-coral-hover font-semibold"
        #rla1="routerLinkActive"
        [class.text-ink]="!rla1.isActive"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="menuOpen.set(false)"
        class="flex min-h-11 items-center gap-3 rounded-sm px-3 hover:bg-blush"
      ><app-icon name="list" />Review Queue</a>
      <a
        routerLink="/ops/failed-events"
        routerLinkActive="bg-blush text-coral-hover font-semibold"
        #rla2="routerLinkActive"
        [class.text-ink]="!rla2.isActive"
        (click)="menuOpen.set(false)"
        class="flex min-h-11 items-center gap-3 rounded-sm px-3 hover:bg-blush"
      ><app-icon name="alert-triangle" />Failed Events</a>
      <a
        routerLink="/ops/audit"
        routerLinkActive="bg-blush text-coral-hover font-semibold"
        #rla6="routerLinkActive"
        [class.text-ink]="!rla6.isActive"
        (click)="menuOpen.set(false)"
        class="flex min-h-11 items-center gap-3 rounded-sm px-3 hover:bg-blush"
      ><app-icon name="clock" />Audit Log</a>
      <a
        routerLink="/ops/shoppers"
        routerLinkActive="bg-blush text-coral-hover font-semibold"
        #rla5="routerLinkActive"
        [class.text-ink]="!rla5.isActive"
        (click)="menuOpen.set(false)"
        class="flex min-h-11 items-center gap-3 rounded-sm px-3 hover:bg-blush"
      ><app-icon name="users" />Shoppers</a>
    }
    @if (auth.hasRole('merchant')) {
      <a
        routerLink="/merchant"
        routerLinkActive="bg-blush text-coral-hover font-semibold"
        #rla3="routerLinkActive"
        [class.text-ink]="!rla3.isActive"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="menuOpen.set(false)"
        class="flex min-h-11 items-center gap-3 rounded-sm px-3 hover:bg-blush"
      ><app-icon name="shopping-bag" />Sales</a>
      <a
        routerLink="/merchant/payouts"
        routerLinkActive="bg-blush text-coral-hover font-semibold"
        #rla4="routerLinkActive"
        [class.text-ink]="!rla4.isActive"
        (click)="menuOpen.set(false)"
        class="flex min-h-11 items-center gap-3 rounded-sm px-3 hover:bg-blush"
      ><app-icon name="wallet" />Payouts</a>
    }
    <div data-testid="sidebar-account" class="mt-auto flex flex-col gap-1 border-t border-hairline pt-4">
      <span class="flex min-h-11 items-center gap-3 px-3 text-sm text-ink-muted">
        <app-icon name="user" />
        <span class="min-w-0 truncate font-mono" title="Signed in as {{ auth.username() }}">{{ auth.username() }}</span>
      </span>
      <button
        type="button"
        (click)="auth.logout()"
        class="flex min-h-11 items-center gap-3 rounded-sm px-3 font-semibold text-declined hover:bg-declined-bg"
      ><app-icon name="log-out" />Log out</button>
    </div>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <main class="flex-1 px-4 pt-6 pb-10 md:px-8">
      <router-outlet />
    </main>
  </div>
</div>
<app-toast-outlet />
