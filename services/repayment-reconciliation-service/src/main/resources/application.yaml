spring:
  application:
    name: repayment-reconciliation-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bridgepay}
    username: ${DB_USERNAME:repayment_reconciliation_service}
    password: ${DB_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: repayment
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    schemas: repayment
    default-schema: repayment
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/bridgepay}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: repayment-reconciliation-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

bridgepay:
  applicant-service:
    base-url: ${APPLICANT_SERVICE_URL:http://localhost:8080}

repayment:
  first-payment-expiry: ${FIRST_PAYMENT_EXPIRY:PT24H}

paddle:
  base-url: ${PADDLE_BASE_URL:https://sandbox-api.paddle.com}
  api-key: ${PADDLE_API_KEY:changeme}
  webhook-secret: ${PADDLE_WEBHOOK_SECRET:changeme}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

server:
  port: 8084

---
spring:
  config:
    activate:
      on-profile: local
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
