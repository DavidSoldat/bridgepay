services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bridgepay
      POSTGRES_USER: bridgepay
      POSTGRES_PASSWORD: bridgepay
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "29092:29092"

  repayment-reconciliation-service:
    build: .
    depends_on:
      - postgres
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bridgepay
      DB_USERNAME: bridgepay
      DB_PASSWORD: bridgepay
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APPLICANT_SERVICE_URL: http://host.docker.internal:8080
      PADDLE_BASE_URL: https://sandbox-api.paddle.com
      PADDLE_API_KEY: ${PADDLE_API_KEY:-changeme}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-changeme}
    ports:
      - "8084:8084"

volumes:
  postgres_data:
