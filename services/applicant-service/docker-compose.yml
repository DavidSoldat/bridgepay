services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bridgepay
      POSTGRES_USER: bridgepay
      POSTGRES_PASSWORD: bridgepay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  applicant-service:
    build: .
    depends_on:
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bridgepay
      DB_USERNAME: bridgepay
      DB_PASSWORD: bridgepay
    ports:
      - "8080:8080"

volumes:
  postgres_data:
