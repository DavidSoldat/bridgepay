spring:
  application:
    name: applicant-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bridgepay}
    username: ${DB_USERNAME:applicant_service}
    password: ${DB_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: applicant
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    schemas: applicant
    default-schema: applicant
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/bridgepay}

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080

  config:
    activate:
      on-profile: local
