spring:
  application:
    name: api-gateway
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/bridgepay}
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: applicants
              uri: ${bridgepay.applicant-service.base-url}
              predicates:
                - Path=/api/v1/applicants/**
            - id: applications
              uri: ${bridgepay.application-service.base-url}
              predicates:
                - Path=/api/v1/applications/**
            - id: merchants
              uri: ${bridgepay.application-service.base-url}
              predicates:
                - Path=/api/v1/merchants/**

bridgepay:
  applicant-service:
    base-url: ${APPLICANT_SERVICE_URL:http://localhost:8080}
  application-service:
    base-url: ${APPLICATION_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

server:
  port: 8086

---
spring:
  config:
    activate:
      on-profile: local
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
