spring:
  application:
    name: api-gateway
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bridgepay}
    username: ${DB_USERNAME:bridgepay}
    password: ${DB_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: audit
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    schemas: audit
    default-schema: audit
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/bridgepay}
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: applicants
              uri: ${bridgepay.applicant-service.base-url}
              predicates:
                - Path=/api/v1/applicants/**
            - id: applications
              uri: ${bridgepay.application-service.base-url}
              predicates:
                - Path=/api/v1/applications/**
            - id: merchants
              uri: ${bridgepay.application-service.base-url}
              predicates:
                - Path=/api/v1/merchants/**
            - id: repayment-plans
              uri: ${bridgepay.repayment-reconciliation-service.base-url}
              predicates:
                - Path=/api/v1/repayment-plans/**
            - id: ops-applicants
              uri: ${bridgepay.applicant-service.base-url}
              predicates:
                - Path=/api/v1/ops/applicants/**
            - id: ops
              uri: ${bridgepay.repayment-reconciliation-service.base-url}
              predicates:
                - Path=/api/v1/ops/**
            - id: notifications
              uri: ${bridgepay.notifications-service.base-url}
              predicates:
                - Path=/api/v1/notifications/**

bridgepay:
  applicant-service:
    base-url: ${APPLICANT_SERVICE_URL:http://localhost:8080}
  application-service:
    base-url: ${APPLICATION_SERVICE_URL:http://localhost:8081}
  repayment-reconciliation-service:
    base-url: ${REPAYMENT_RECONCILIATION_SERVICE_URL:http://localhost:8084}
  notifications-service:
    base-url: ${NOTIFICATIONS_SERVICE_URL:http://localhost:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

server:
  port: 8086

---
spring:
  config:
    activate:
      on-profile: local
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
